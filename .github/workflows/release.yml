name: SENTINEL_6 Multi-Platform Release 🚀

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
            build_cmd: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            asset_name: sentinel-6-android.apk
            artifact_key: android-apk
            
          - os: ubuntu-latest
            target: web
            build_cmd: flutter build web --release
            artifact_path: build/web
            asset_name: sentinel-6-web.zip
            artifact_key: web-zip
            
          - os: ubuntu-latest
            target: linux
            build_cmd: flutter build linux --release
            artifact_path: build/linux/x64/release/bundle
            asset_name: sentinel-6-linux.zip
            artifact_key: linux-zip

          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            artifact_path: build\windows\x64\runner\Release
            asset_name: sentinel-6-windows.zip
            artifact_key: windows-zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Zip Web/Linux
        if: matrix.target == 'web' || matrix.target == 'linux'
        run: |
          cd ${{ matrix.artifact_path }}
          zip -r ../../../../${{ matrix.asset_name }} .
        shell: bash

      - name: Zip Windows
        if: matrix.target == 'windows'
        run: Compress-Archive -Path ${{ matrix.artifact_path }}\* -DestinationPath ${{ matrix.asset_name }}
        shell: powershell

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_key }}
          path: ${{ matrix.target == 'apk' && matrix.artifact_path || matrix.asset_name }}

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## SENTINEL_6 Deployment Core 🚀
            **Next Level Game Changer - Multi-platform Release!**
            The Brutalist Audit Engine is now available for Android, Web, Windows, and Linux.

            cc: @10xdev4u-alt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
